services:
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      java-api:
        condition: service_healthy
    restart: unless-stopped

  java-api:
    build: ./backend-java
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/finflow
      DATABASE_USERNAME: finflow
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-finflow}
      FINFLOW_DEMO_DATABASE_URL: ${FINFLOW_DEMO_DATABASE_URL:-jdbc:postgresql://postgres:5432/finflow}
      FINFLOW_DEMO_DATABASE_USERNAME: ${FINFLOW_DEMO_DATABASE_USERNAME:-finflow}
      FINFLOW_DEMO_DATABASE_PASSWORD: ${FINFLOW_DEMO_DATABASE_PASSWORD:-finflow}
      DATABASE_DRIVER: org.postgresql.Driver
      WORKER_BASE_URL: http://python-worker:8001
      FINFLOW_STORAGE_PROVIDER: s3
      FINFLOW_STORAGE_CACHE_ROOT: /app/data/blob-cache
      FINFLOW_S3_ENDPOINT: http://minio:9000
      FINFLOW_S3_BUCKET: finflow
      FINFLOW_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-finflow}
      FINFLOW_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-finflow-storage-secret}
      FINFLOW_OFFICE_ENABLED: "true"
      FINFLOW_OFFICE_DOCUMENT_SERVER_URL: ${FINFLOW_OFFICE_DOCUMENT_SERVER_URL:-/office}
      FINFLOW_OFFICE_INTERNAL_URL: http://onlyoffice-documentserver
      FINFLOW_OFFICE_API_BASE_URL: http://java-api:8080
      FINFLOW_OFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-finflow-office-secret}
    depends_on:
      postgres:
        condition: service_healthy
      python-worker:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      onlyoffice-documentserver:
        condition: service_healthy
    volumes:
      - finflow-files:/app/data/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  python-worker:
    build: ./worker-python
    environment:
      FINFLOW_LLM_PROVIDER: ${FINFLOW_LLM_PROVIDER:-codex}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-4000}
      FINFLOW_AGENT_ENABLED: ${FINFLOW_AGENT_ENABLED:-true}
      FINFLOW_AGENT_SKILLS_DIR: ${FINFLOW_AGENT_SKILLS_DIR:-skills}
      FINFLOW_AGENT_MCP_CONFIG: ${FINFLOW_AGENT_MCP_CONFIG:-}
      FINFLOW_AGENT_MCP_ALLOWED_TOOLS: ${FINFLOW_AGENT_MCP_ALLOWED_TOOLS:-}
      CODEX_CLI_MODEL: ${CODEX_CLI_MODEL:-gpt-5.6-sol}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-v4-flash}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      HF_HOME: /app/models
    volumes:
      - finflow-models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finflow
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-finflow}
    volumes:
      - finflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d finflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-finflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-finflow-storage-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - finflow-objects:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/finflow"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-finflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-finflow-storage-secret}

  onlyoffice-documentserver:
    image: onlyoffice/documentserver:8.3.3
    platform: ${ONLYOFFICE_PLATFORM:-linux/amd64}
    ports:
      - "8082:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-finflow-office-secret}
      JWT_HEADER: AuthorizationJwt
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    volumes:
      - finflow-onlyoffice-data:/var/www/onlyoffice/Data
      - finflow-onlyoffice-logs:/var/log/onlyoffice
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

volumes:
  finflow-postgres:
  finflow-files:
  finflow-models:
  finflow-objects:
  finflow-onlyoffice-data:
  finflow-onlyoffice-logs:
