# Standalone internal deployment. Do not merge with docker-compose.yml.
name: finflow-internal
services:
  frontend:
    image: finflow-internal/frontend:${FINFLOW_IMAGE_TAG:-local}
    build: ./frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:80"]
    volumes: ["./deploy/internal/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      java-api: {condition: service_healthy}
      onlyoffice-documentserver: {condition: service_healthy}
    restart: unless-stopped
  java-api:
    image: finflow-internal/java-api:${FINFLOW_IMAGE_TAG:-local}
    build: ./backend-java
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/finflow
      DATABASE_USERNAME: finflow
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      DATABASE_DRIVER: org.postgresql.Driver
      WORKER_BASE_URL: http://python-worker:8001
      FINFLOW_AGENT_GATEWAY_BASE_URL: http://java-api:8080
      FINFLOW_AUTH_DEFAULT_USERNAME: ${FINFLOW_AUTH_DEFAULT_USERNAME:?Set login username}
      FINFLOW_AUTH_DEFAULT_PASSWORD: ${FINFLOW_AUTH_DEFAULT_PASSWORD:?Set login password}
      FINFLOW_AUTH_JWT_SECRET: ${FINFLOW_AUTH_JWT_SECRET:?Set session secret}
      FINFLOW_AUTH_SECURE_COOKIE: ${FINFLOW_AUTH_SECURE_COOKIE:-true}
      FINFLOW_STORAGE_PROVIDER: s3
      FINFLOW_STORAGE_CACHE_ROOT: /app/data/blob-cache
      FINFLOW_DATA_CONNECTION_KEY_FILE: /app/data/keys/data-connection.key
      FINFLOW_S3_ENDPOINT: http://minio:9000
      FINFLOW_S3_BUCKET: finflow
      FINFLOW_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-finflow}
      FINFLOW_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set storage password}
      FINFLOW_OFFICE_ENABLED: "true"
      FINFLOW_OFFICE_DOCUMENT_SERVER_URL: /office
      FINFLOW_OFFICE_INTERNAL_URL: http://onlyoffice-documentserver
      FINFLOW_OFFICE_API_BASE_URL: http://java-api:8080
      FINFLOW_OFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set office secret}
      FINFLOW_OFFICE_MAX_EDITOR_FILE_BYTES: "314572800"
    volumes: ["api-data:/app/data"]
    depends_on:
      postgres: {condition: service_healthy}
      python-worker: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      onlyoffice-documentserver: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  python-worker:
    image: finflow-internal/python-worker:${FINFLOW_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/internal/Dockerfile.worker
      args: {PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"}
    environment:
      FINFLOW_LLM_PROVIDER: ${FINFLOW_LLM_PROVIDER:-codex}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-16000}
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      AGENT_RUNTIME: ${AGENT_RUNTIME:-opencode}
      OPENCODE_CLI_PATH: ${OPENCODE_CLI_PATH:-opencode}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENCODE_PROVIDER_CONFIG: ${OPENCODE_PROVIDER_CONFIG:-}
      AGENT_MAX_TOOL_CALLS: "80"
      AGENT_TASK_TIMEOUT_SECONDS: "1800"
      FINFLOW_DUCKDB_MEMORY_MB: "2048"
      RESEARCH_SEARCH_PROVIDER: searxng
      RESEARCH_SEARXNG_URL: http://searxng:8080
      NO_PROXY: localhost,127.0.0.1,java-api,python-worker,postgres,minio,searxng,onlyoffice-documentserver
      HF_HOME: /app/models
    volumes: ["models:/app/models"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finflow
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d finflow"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-finflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set storage password}
    volumes: ["objects:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-finflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set storage password}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/finflow"]
  onlyoffice-documentserver:
    image: onlyoffice/documentserver:8.3.3
    platform: ${ONLYOFFICE_PLATFORM:-linux/amd64}
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set office secret}
      JWT_HEADER: AuthorizationJwt
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    volumes: ["office-data:/var/www/onlyoffice/Data", "office-logs:/var/log/onlyoffice"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
    restart: unless-stopped
  searxng:
    profiles: [research]
    image: ghcr.io/searxng/searxng:2026.9.25-12f8b6515
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set search secret}
      SEARXNG_LIMITER: "false"
    volumes: ["./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro", "search-cache:/var/cache/searxng"]
    restart: unless-stopped
volumes:
  postgres-data:
  objects:
  api-data:
  models:
  office-data:
  office-logs:
  search-cache:
