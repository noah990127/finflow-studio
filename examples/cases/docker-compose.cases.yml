services:
  demo-api:
    build: ./examples/cases/demo-api
    image: finflow-demo-api:1.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  java-api:
    depends_on:
      demo-api:
        condition: service_healthy
