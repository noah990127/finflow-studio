map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map $http_x_forwarded_proto $public_proto { default $scheme; https https; }
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 320m;
    location /api/ {
        proxy_pass http://java-api:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }
    location /office/ {
        proxy_pass http://onlyoffice-documentserver/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host/office;
        proxy_set_header X-Forwarded-Proto $public_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
